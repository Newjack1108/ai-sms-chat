<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WIP Dashboard - Production System</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <link rel="stylesheet" href="common.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-logo">
            <img src="logo.png" alt="Company Logo" onerror="this.style.display='none';">
            <h1>Work In Progress (WIP) Dashboard</h1>
        </div>
        <div class="navbar-right">
            <span class="navbar-user" id="userInfo"></span>
            <a href="dashboard.html" class="btn btn-secondary btn-sm">Dashboard</a>
            <a href="components.html" class="btn btn-secondary btn-sm">Components</a>
            <a href="panels.html" class="btn btn-secondary btn-sm">Panels</a>
            <button onclick="logout()" class="btn btn-danger btn-sm">Logout</button>
        </div>
    </nav>
    
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>WIP Summary</h2>
                <button onclick="loadWIP()" class="btn btn-primary">Refresh</button>
            </div>
            <div id="wipSummary" style="margin-bottom: 20px;">
                <div class="loading">Loading...</div>
            </div>
            <div id="wipList">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>
    
    <script src="common.js"></script>
    <script>
        let currentUser = null;
        let labourRate = 25;
        
        async function init() {
            // Redirect staff users
            if (await restrictStaffAccess()) return;
            
            currentUser = await checkAuth();
            if (!currentUser) return;
            initNavbar();
            await loadLabourRate();
            loadWIP();
        }
        
        async function loadLabourRate() {
            try {
                const data = await apiCall('/settings/labour_rate_per_hour');
                labourRate = parseFloat(data.value || 25);
            } catch (error) {
                console.error('Error loading labour rate:', error);
            }
        }
        
        async function loadWIP() {
            try {
                const data = await apiCall('/wip');
                const wip = data.wip || [];
                const kindLabel = (item) => item.item_type === 'component' ? 'Component' : 'Panel';
                
                let totalWIPValue = 0;
                let panelWIPValue = 0;
                let componentWIPValue = 0;
                let lowStockCount = 0;
                
                wip.forEach(item => {
                    const value = parseFloat(item.wip_value || 0);
                    totalWIPValue += value;
                    if (item.item_type === 'component') {
                        componentWIPValue += value;
                    } else {
                        panelWIPValue += value;
                    }
                    if (item.is_low_stock) lowStockCount++;
                });
                
                document.getElementById('wipSummary').innerHTML = `
                    <div class="grid grid-3">
                        <div class="card" style="background: #f8f9fa;">
                            <h3 style="margin: 0 0 10px 0; color: #2c3e50;">Total WIP Value</h3>
                            <p style="font-size: 24px; font-weight: bold; color: #667eea; margin: 0;">${formatCurrency(totalWIPValue)}</p>
                            <p style="margin: 8px 0 0 0; color: #6c757d; font-size: 12px;">Panels and components still on hand. Issued components sit in the panel value.</p>
                        </div>
                        <div class="card" style="background: #f8f9fa;">
                            <h3 style="margin: 0 0 10px 0; color: #2c3e50;">Panels / Components</h3>
                            <p style="font-size: 24px; font-weight: bold; color: #28a745; margin: 0;">${formatCurrency(panelWIPValue)}</p>
                            <p style="margin: 8px 0 0 0; color: #6c757d; font-size: 12px;">Components on hand: ${formatCurrency(componentWIPValue)}</p>
                        </div>
                        <div class="card" style="background: #f8f9fa;">
                            <h3 style="margin: 0 0 10px 0; color: #2c3e50;">Low Stock Alerts</h3>
                            <p style="font-size: 24px; font-weight: bold; color: ${lowStockCount > 0 ? '#dc3545' : '#28a745'}; margin: 0;">${lowStockCount}</p>
                        </div>
                    </div>
                `;
                
                if (wip.length === 0) {
                    document.getElementById('wipList').innerHTML = '<p>No panels or components found</p>';
                    return;
                }
                
                document.getElementById('wipList').innerHTML = `
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Kind</th>
                                <th>Name</th>
                                <th>Type</th>
                                <th>Built Qty</th>
                                <th>Min Stock</th>
                                <th>BOM Value</th>
                                <th>Labour Hours</th>
                                <th>Labour Cost</th>
                                <th>True Cost</th>
                                <th>WIP Value</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${wip.map(item => {
                                const isLow = item.is_low_stock;
                                const subtype = item.item_subtype || item.panel_type || '-';
                                return `
                                    <tr style="${isLow ? 'background: #fff3cd;' : ''}">
                                        <td>${kindLabel(item)}</td>
                                        <td><strong>${item.item_name || item.panel_name}</strong></td>
                                        <td>${subtype}</td>
                                        <td>${Number(item.built_quantity || 0).toFixed(2)}</td>
                                        <td>${Number(item.min_stock || 0).toFixed(2)}</td>
                                        <td>${formatCurrency(item.bom_value)}</td>
                                        <td>${Number(item.labour_hours || 0).toFixed(2)}</td>
                                        <td>${formatCurrency(item.labour_cost)}</td>
                                        <td><strong>${formatCurrency(item.true_cost)}</strong></td>
                                        <td><strong style="color: #667eea;">${formatCurrency(item.wip_value)}</strong></td>
                                        <td>${isLow ? '<span class="badge badge-danger">Low Stock</span>' : '<span class="badge badge-success">OK</span>'}</td>
                                    </tr>
                                `;
                            }).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                document.getElementById('wipList').innerHTML = '<p>Error loading WIP data</p>';
                console.error('Error loading WIP:', error);
            }
        }
        
        init();
    </script>
    
    <footer class="footer">
        <div class="footer-content">
            <div class="footer-logo">
                <img src="logo.png" alt="Company Logo" onerror="this.style.display='none';">
            </div>
            <div class="footer-info">
                <p>&copy; <script>document.write(new Date().getFullYear())</script> Production System. All rights reserved.</p>
            </div>
        </div>
    </footer>
</body>
</html>
